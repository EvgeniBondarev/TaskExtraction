# www -> основной домен без www
server {
    listen 80;
    server_name ~^www\.(?<root_domain>.+)$;
    return 301 https://$root_domain$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # Относительные редиректы: за TLS-прокси схема/порт контейнера не должны попадать в Location.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;

    # Несуществующие URL отдают настоящий 404, а не главную страницу (иначе поисковики копят soft-404 дубли).
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Файлы Vite с хэшем в имени можно кэшировать навсегда.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # Публичные маршруты SPA.
    location ~ ^/(welcome|guide|privacy)/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # Закрытые маршруты SPA: открываются, но не индексируются.
    location ~ ^/(login|feed|logs|settings|telegram|analytics)/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location ^~ /admin {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location = /og-image.png {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # A standalone HTML document gives task links their own static social preview.
    # The task contents remain private: crawlers receive only product-level metadata.
    location ^~ /task/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /task/index.html;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
