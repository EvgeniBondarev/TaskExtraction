<!DOCTYPE html>

    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />

    <title>__SEO_TITLE__</title>
    <meta name="description" content="__SEO_DESCRIPTION__" />

__YANDEX_VERIFICATION_META__
__GOOGLE_VERIFICATION_META__

    <meta property="og:type" content="__SEO_OG_TYPE__" />
    <meta property="og:site_name" content="TaskExtraction" />
    <meta property="og:title" content="__SEO_SHARE_TITLE__" />
    <meta property="og:description" content="__SEO_SHARE_DESCRIPTION__" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="__SEO_CANONICAL__" />
    <meta property="og:image" content="__SEO_OG_IMAGE__" />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="__SEO_OG_WIDTH__" />
    <meta property="og:image:height" content="__SEO_OG_HEIGHT__" />
    <meta property="og:image:alt" content="__SEO_OG_IMAGE_ALT__" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="__SEO_OG_IMAGE__" />
    <meta name="twitter:image:alt" content="__SEO_OG_IMAGE_ALT__" />

    <link rel="image_src" href="__SEO_OG_IMAGE__" />
    <meta itemprop="name" content="__SEO_SHARE_TITLE__" />
